# Netlify site for the admin panel. In Netlify set "Base directory" to frontend/admin.
# Also set VITE_API_URL in Site settings → Environment variables (see .env.example).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The Lovable config builds for Cloudflare by default; this makes nitro
  # output a Netlify Function for server rendering instead.
  NITRO_PRESET = "netlify"
