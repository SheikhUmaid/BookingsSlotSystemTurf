<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- Mowed turf stripes -->
    <rect width="512" height="512" fill="#15803d"/>
    <rect y="0" width="512" height="64" fill="#16a34a"/>
    <rect y="128" width="512" height="64" fill="#16a34a"/>
    <rect y="256" width="512" height="64" fill="#16a34a"/>
    <rect y="384" width="512" height="64" fill="#16a34a"/>
    <!-- Pitch markings -->
    <g fill="none" stroke="#f0fdf4" stroke-width="16" stroke-linejoin="round">
      <rect x="136" y="96" width="240" height="320" rx="6"/>
      <line x1="136" y1="256" x2="376" y2="256"/>
      <circle cx="256" cy="256" r="46"/>
      <rect x="196" y="96" width="120" height="54"/>
      <rect x="196" y="362" width="120" height="54"/>
    </g>
    <circle cx="256" cy="256" r="10" fill="#f0fdf4"/>
  </g>
</svg>
